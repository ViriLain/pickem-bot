name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # go.sum is not committed yet: the build sandbox has no module proxy.
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...

name: ci
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # The build sandbox this repo is developed in cannot reach the Go module
      # proxy, so CI resolves dependencies and commits go.mod/go.sum back.
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...
      - name: Commit go.mod and go.sum when tidy changed them
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- go.mod go.sum || [ -n "$(git ls-files --others --exclude-standard go.sum)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "go mod tidy [skip ci]"
            git push
          fi
